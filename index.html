<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<style>
  :root {
    --tarmac: #EDEAE3;
    --surface: #FFFFFF;
    --racing-green: #0B3D2E;
    --signal-red: #D8232A;
    --ink: #1A1A1A;
    --ink-soft: #565650;
    --border: #D9D5CB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--tarmac);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  h1, h2, h3, .display {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }

  header {
    background: var(--racing-green);
    color: var(--surface);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  header h1 {
    font-size: 1.6rem;
    text-transform: none;
  }

  header .user-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.95rem;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    border: none;
    border-radius: 4px;
    padding: 0.6rem 1.1rem;
    cursor: pointer;
    min-height: 44px;
  }

  .btn-primary {
    background: var(--signal-red);
    color: var(--surface);
  }
  .btn-primary:hover { background: #B81E24; }

  .btn-ghost {
    background: transparent;
    color: var(--surface);
    border: 1px solid rgba(255,255,255,0.5);
  }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.25rem;
  }

  select#season-select {
    width: 100%;
    max-width: 220px;
    padding: 0.6rem 0.75rem;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    margin-bottom: 1.25rem;
    min-height: 44px;
  }

  .race-row {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--racing-green);
    border-radius: 4px;
    padding: 0.9rem 1rem;
    margin-bottom: 0.75rem;
  }

  .race-round {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--racing-green);
    min-width: 2.5ch;
    line-height: 1;
  }

  .race-body { flex: 1; min-width: 0; }

  .race-name {
    font-weight: 600;
    font-size: 1.05rem;
  }

  .race-meta {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin-top: 0.15rem;
  }

  .race-actions { margin-top: 0.6rem; }

  .picks-summary {
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    margin-top: 0.4rem;
  }

  .picks-summary .points {
    font-weight: 700;
    color: var(--signal-red);
  }

  .pick-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem;
    margin-top: 0.75rem;
  }

  .podium-slot {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
  }

  .podium-slot select {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding: 0.5rem 0.6rem;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
  }

  .podium-place {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--racing-green);
    min-width: 2.5ch;
  }

  .podium-row {
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    font-size: 0.95rem;
  }
  
  @media (min-width: 520px) {
    .driver-grid { grid-template-columns: 1fr 1fr; }
  }

  .driver-option input {
    width: 20px;
    height: 20px;
  }

  #app-content {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
  }

  @media (min-width: 600px) {
    #app-content {
        grid-template-columns: 1fr 1fr;
    }
  }

  @media (max-width: 480px) {
    header { padding: 0.85rem 1rem; }
    header h1 { font-size: 1.35rem; }
    main { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>F1 Fantasy</h1>
  <div id="logged-out">
    <button id="login" class="btn-primary">Log In / Sign Up</button>
  </div>
  <div id="logged-in" class="user-info" style="display: none;">
    <span>Logged in as <span id="user-email"></span></span>
    <button id="logout" class="btn-ghost">Log Out</button>
  </div>
</header>

<main>
  <select id="season-select">
    <option value="2025">2025</option>
    <option value="2026">2026</option>
  </select>

  <div id="app-content"></div>
</main>

<script>
let auth0Client;
let accessToken;
let selectedRace = null;

const API_BASE = "https://f1-fantasy-api-969674889181.us-central1.run.app";

async function init() {
    auth0Client = await auth0.createAuth0Client({
        domain: "dev-ju7ftymn7fbv0nm8.us.auth0.com",
        clientId: "r3Lo692YGc1eTp1VYMGRX5yKzPYrgkIV",
        authorizationParams: {
            audience: "https://f1-fantasy-api",
            redirect_uri: window.location.href.split('?')[0],
            scope: "openid profile email offline_access"
        },
        useRefreshTokens: true,
        cacheLocation: "localstorage"
    });

    const query = window.location.search;
    if (query.includes("code=") && query.includes("state=")) {
        await auth0Client.handleRedirectCallback();
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    document.getElementById("login").disabled = false;

    const isAuthenticated = await auth0Client.isAuthenticated();
    updateUI(isAuthenticated);

    if (isAuthenticated) {
        accessToken = await auth0Client.getTokenSilently();
        const user = await auth0Client.getUser();
        document.getElementById("user-email").innerText = user.email || "(no email)";

        await fetch(`${API_BASE}/users/me`, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${accessToken}` }
        });
    }

    loadRaces(document.getElementById("season-select").value);
}

function updateUI(isAuthenticated) {
    document.getElementById("logged-out").style.display = isAuthenticated ? "none" : "block";
    document.getElementById("logged-in").style.display = isAuthenticated ? "flex" : "none";
}

async function loadRaces(season) {
    const response = await fetch(`${API_BASE}/races/${season}`);
    if (!response.ok) {
        document.getElementById("app-content").innerText = "No races found for that season.";
        return;
    }
    const races = await response.json();
    await renderRaces(races);
}

async function renderRaces(races) {
    const container = document.getElementById("app-content");
    container.innerHTML = "";

    for (const race of races) {
        const card = document.createElement("div");
        card.className = "race-row";
        card.innerHTML = `
            <span class="race-round">R${race.round}</span>
            <div class="race-body">
                <div class="race-name">${race.race_name}</div>
                <div class="race-meta">${race.circuit_name} · ${race.date}</div>
            </div>
        `;

        const raceBody = card.querySelector(".race-body");
        const actionArea = document.createElement("div");
        actionArea.className = "race-actions";
        raceBody.appendChild(actionArea);

        if (accessToken) {
            const picksResponse = await fetch(`${API_BASE}/picks/${race.season}/${race.round}`, {
                headers: { "Authorization": `Bearer ${accessToken}` }
            });
            if (picksResponse.ok) {
                const picks = await picksResponse.json();
                if (picks.length > 0) {
                    renderExistingPicks(actionArea, race, picks);
                } else {
                    renderPickButton(actionArea, race);
                }
            }
        }

        container.appendChild(card);
    }
}

function renderPickButton(container, race) {
    const button = document.createElement("button");
    button.className = "btn-primary";
    button.innerText = "Submit picks";
    button.addEventListener("click", () => showPickForm(container, race));
    container.appendChild(button);
}

async function renderExistingPicks(container, race, picks) {
    container.innerHTML = "";

    if (picks.some(p => p.place != null)) {
        await renderPodiumPicks(container, race, picks);
    } else {
        await renderLegacyPicks(container, race, picks);
    }
}

async function renderPodiumPicks(container, race, picks) {
    const ordinals = { 1: "1st", 2: "2nd", 3: "3rd" };

    const list = document.createElement("div");
    list.className = "podium-list";
    picks
        .filter(p => p.place != null)
        .forEach(p => {
            const row = document.createElement("div");
            row.className = "podium-row";
            row.innerHTML = `<span class="podium-place">${ordinals[p.place]}</span><span>${p.name}</span>`;
            list.appendChild(row);
        });
    container.appendChild(list);

    const scoreResponse = await fetch(`${API_BASE}/podium-scores/${race.season}/${race.round}`, {
        headers: { "Authorization": `Bearer ${accessToken}` }
    });
    const scoreData = scoreResponse.ok ? await scoreResponse.json() : null;

    if (scoreData && scoreData.score.total !== null) {
        const total = document.createElement("p");
        total.className = "picks-summary";
        total.innerHTML = `<span class="points">${scoreData.score.total} pts</span>`;
        container.appendChild(total);
    }
}

async function renderLegacyPicks(container, race, picks) {
    const scoreResponse = await fetch(`${API_BASE}/scores/${race.season}?race_id=${race.id}`, {
        headers: { "Authorization": `Bearer ${accessToken}` }
    });
    const scoreData = scoreResponse.ok ? await scoreResponse.json() : null;
    const points = scoreData && scoreData.scores ? scoreData.scores.points : null;

    const p = document.createElement("p");
    p.className = "picks-summary";
    p.innerHTML = `Your picks: ${picks.map(x => x.name).join(", ")}${points !== null ? ` — <span class="points">${points} pts</span>` : ""}`;
    container.appendChild(p);
}

async function showPickForm(container, race) {
    const response = await fetch(`${API_BASE}/drivers/${race.season}/?limit=100`);
    const drivers = await response.json();

    container.innerHTML = "";
    const form = document.createElement("div");
    form.className = "pick-form";

    const labels = { 1: "1st", 2: "2nd", 3: "3rd" };
    const options = drivers.map(d => `<option value="${d.id}">${d.name}</option>`).join("");

    const selects = [1, 2, 3].map(place => {
        const row = document.createElement("label");
        row.className = "podium-slot";
        row.innerHTML = `<span class="podium-place">${labels[place]}</span>`;

        const select = document.createElement("select");
        select.dataset.place = place;
        select.innerHTML = `<option value="">Choose a driver</option>${options}`;
        select.addEventListener("change", () => syncOptions(selects));

        row.appendChild(select);
        form.appendChild(row);
        return select;
    });

    const submitButton = document.createElement("button");
    submitButton.className = "btn-primary";
    submitButton.innerText = "Submit picks";
    submitButton.addEventListener("click", () => submitPicks(container, race, selects));
    form.appendChild(submitButton);

    container.appendChild(form);
}

function syncOptions(selects) {
    const chosen = new Set(selects.map(s => s.value).filter(v => v !== ""));
    selects.forEach(select => {
        Array.from(select.options).forEach(option => {
            option.disabled = option.value !== "" && chosen.has(option.value) && option.value !== select.value;
        });
    });
}

async function submitPicks(container, race, selects) {
    if (selects.some(s => s.value === "")) {
        alert("Choose a driver for each place.");
        return;
    }

    const picks = selects.map(s => ({
        driver_id: parseInt(s.value),
        place: parseInt(s.dataset.place)
    }));

    const response = await fetch(`${API_BASE}/podium-picks`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${accessToken}` },
        body: JSON.stringify({ race_id: race.id, picks })
    });

    if (response.ok) {
        const picksResponse = await fetch(`${API_BASE}/picks/${race.season}/${race.round}`, {
            headers: { "Authorization": `Bearer ${accessToken}` }
        });
        renderExistingPicks(container, race, await picksResponse.json());
    } else {
        const error = await response.json();
        alert(`Failed to submit picks: ${error.detail}`);
    }
}

document.getElementById("season-select").addEventListener("change", (event) => {
    loadRaces(event.target.value);
});

document.getElementById("login").addEventListener("click", () => {
    auth0Client.loginWithRedirect();
});

document.getElementById("logout").addEventListener("click", () => {
    auth0Client.logout({ logoutParams: { returnTo: window.location.href.split('?')[0] } });
});

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
